version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Yüklenen medya dosyaları kalıcı volume'da saklanır.
      # Container yeniden başlasa veya yeni image deploy edilse bile dosyalar kaybolmaz.
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  uploads_data:
    driver: local
